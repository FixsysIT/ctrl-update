name: Ververs CTRL UPDATE

on:
  schedule:
    - cron: "30 6 * * *"
      timezone: "Europe/Amsterdam"
    - cron: "0 14 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      teams_test:
        description: "Stuur één gecontroleerde Teams-testmelding"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ctrl-update-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Bronnen, agentreview en publicatie
    runs-on: ubuntu-latest
    env:
      TEAMS_WEBHOOK_CONFIGURED: ${{ secrets.TEAMS_WEBHOOK_URL != '' }}
      SERVICE_HEALTH_CONFIGURED: ${{ vars.CTRL_UPDATE_ENTRA_CLIENT_ID != '' && vars.CTRL_UPDATE_ENTRA_TENANT_ID != '' }}
      MESSAGE_CENTER_ENABLED: ${{ vars.CTRL_UPDATE_MESSAGE_CENTER_ENABLED == 'true' }}
    timeout-minutes: 60

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Vereiste secret controleren
        shell: pwsh
        env:
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: |
          if ($env:OPENAI_KEY_PRESENT -ne 'true') {
            throw 'Repository-secret OPENAI_API_KEY ontbreekt. De bestaande productieversie blijft online.'
          }
          if ($env:TEAMS_WEBHOOK_CONFIGURED -ne 'true') {
            Write-Warning 'Repository-secret TEAMS_WEBHOOK_URL ontbreekt. De refresh gaat door zonder Teams-meldingen.'
          }
          if ($env:MESSAGE_CENTER_ENABLED -eq 'true' -and $env:SERVICE_HEALTH_CONFIGURED -ne 'true') {
            throw 'Message Center is geactiveerd, maar de Entra client- of tenantvariabele ontbreekt.'
          }

      - name: Aanmelden voor Microsoft 365 Service Health
        if: ${{ env.SERVICE_HEALTH_CONFIGURED == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ vars.CTRL_UPDATE_ENTRA_CLIENT_ID }}
          tenant-id: ${{ vars.CTRL_UPDATE_ENTRA_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Kortlevend Graph-token ophalen
        if: ${{ env.SERVICE_HEALTH_CONFIGURED == 'true' }}
        shell: pwsh
        run: |
          $token = az account get-access-token --resource-type ms-graph --query accessToken -o tsv
          if ([string]::IsNullOrWhiteSpace($token)) { throw 'Microsoft Graph-token ontbreekt.' }
          Write-Output "::add-mask::$token"

          $payload = $token.Split('.')[1].Replace('-', '+').Replace('_', '/')
          while ($payload.Length % 4) { $payload += '=' }
          $claims = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($payload)) | ConvertFrom-Json
          $roles = @($claims.roles | ForEach-Object { [string]$_ })
          $requiredRoles = @('ServiceHealth.Read.All')
          if ($env:MESSAGE_CENTER_ENABLED -eq 'true') { $requiredRoles += 'ServiceMessage.Read.All' }
          $missingRoles = @($requiredRoles | Where-Object { $_ -notin $roles })
          if ($missingRoles.Count) {
            throw "De Entra-app mist vereiste Graph-rollen: $($missingRoles -join ', ')."
          }
          $allowedRoles = @('ServiceHealth.Read.All', 'ServiceMessage.Read.All')
          $excessiveRoles = @($roles | Where-Object { $_ -notin $allowedRoles })
          if ($excessiveRoles.Count) {
            throw "De CTRL UPDATE-app heeft te ruime Graph-rechten: $($excessiveRoles -join ', ')."
          }
          "CTRL_UPDATE_GRAPH_TOKEN=$token" >> $env:GITHUB_ENV

      - name: Bronnen ophalen en reviewinput voorbereiden
        shell: pwsh
        run: |
          $messageCenter = @{}
          if ($env:MESSAGE_CENTER_ENABLED -ne 'true') { $messageCenter.SkipMessageCenter = $true }
          ./scripts/Update-CtrlUpdate.ps1 @messageCenter -PrepareAgentReviewOnly

      - name: Nieuwe en gewijzigde items selecteren
        id: pending
        shell: pwsh
        run: |
          $batchSize = 10
          $count = ./scripts/New-CtrlUpdateReviewBatch.ps1 -BatchSize $batchSize
          $batchCount = [int][Math]::Ceiling($count / [double]$batchSize)
          if ($batchCount -gt 8) { throw "Te veel agentreviewbatches: $batchCount (maximaal 8)." }
          "count=$count" >> $env:GITHUB_OUTPUT
          "batch_count=$batchCount" >> $env:GITHUB_OUTPUT
          "required=$($count -gt 0)".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Reviewbatch 1 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 1 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-1.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 1 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 1 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-1.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-1
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 2 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 2 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-2.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 2 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 2 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-2.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-2
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 3 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 3 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-3.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 3 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 3 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-3.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-3
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 4 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 4 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-4.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 4 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 4 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-4.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-4
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 5 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 5 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-5.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 5 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 5 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-5.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-5
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 6 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 6 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-6.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 6 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 6 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-6.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-6
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 7 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 7 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-7.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 7 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 7 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-7.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-7
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Reviewbatch 8 voorbereiden
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 8 }}
        shell: pwsh
        run: Copy-Item -LiteralPath .tmp/review-batches/batch-8.json -Destination .tmp/review-current.json -Force

      - name: Reviewbatch 8 inhoudelijk beoordelen
        if: ${{ fromJSON(steps.pending.outputs.batch_count) >= 8 }}
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/review-items.md
          output-file: .tmp/review-result-8.json
          codex-home: ${{ runner.temp }}/ctrl-update-codex-8
          codex-args: '["--ephemeral", "--output-schema", "schemas/review.schema.json"]'
          model: gpt-5.6-terra
          effort: medium
          sandbox: read-only
          safety-strategy: read-only

      - name: Agentreview valideren en samenvoegen
        if: steps.pending.outputs.required == 'true'
        shell: pwsh
        run: ./scripts/Merge-CtrlUpdateReview.ps1 -ResultPath '.tmp/review-result-*.json'

      - name: Definitieve publicatie genereren
        shell: pwsh
        run: |
          $messageCenter = @{}
          if ($env:MESSAGE_CENTER_ENABLED -ne 'true') { $messageCenter.SkipMessageCenter = $true }
          ./scripts/Update-CtrlUpdate.ps1 @messageCenter -UsePreparedSnapshot -UseReviewCacheOnly -RequireAgentReview

      - name: Repository controleren
        shell: pwsh
        run: ./scripts/Test-CtrlUpdate.ps1

      - name: Teams-koppeling testen
        if: ${{ env.TEAMS_WEBHOOK_CONFIGURED == 'true' && inputs.teams_test == true }}
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: >-
          ./scripts/Send-CtrlUpdateTeamsNotification.ps1
          -TestNotification

      - name: Teams melden bij nieuwe acties of problemen
        if: ${{ env.TEAMS_WEBHOOK_CONFIGURED == 'true' && inputs.teams_test != true }}
        continue-on-error: true
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: ./scripts/Send-CtrlUpdateTeamsNotification.ps1

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Website voor publicatie uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Gewijzigde data publiceren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/notification-state.json data/review-cache.json data/state.json dist/index.html
          if git diff --cached --quiet; then
            echo "Geen inhoudelijke wijzigingen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Automatische nieuwsupdate"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Teams melden wanneer de refresh mislukt
        if: ${{ failure() && env.TEAMS_WEBHOOK_CONFIGURED == 'true' }}
        continue-on-error: true
        shell: pwsh
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: >-
          ./scripts/Send-CtrlUpdateTeamsNotification.ps1
          -FailureMessage 'De automatische bronverwerking, agentreview of kwaliteitscontrole is mislukt.'

  deploy:
    name: Publiceer de geslaagde refresh
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v5
