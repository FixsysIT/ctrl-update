name: Publiceer CTRL UPDATE

on:
  push:
    branches:
      - main
    paths:
      - "dist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publiceer statische site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v6

      - name: GitHub Pages configureren
        uses: actions/configure-pages@v5

      - name: Website uploaden
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Website publiceren
        id: deployment
        uses: actions/deploy-pages@v5
